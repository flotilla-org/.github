# Shared Claude code review for flotilla-org repositories (flotilla-org/flotilla#2754).
# Callers pin a tag of this repository (v1), so moving the tag rolls every caller.
name: Claude Code Review (shared)

on:
  workflow_call:
    inputs:
      guidance:
        description: What the reviewer reads for style and conventions.
        type: string
        default: "the repository's CLAUDE.md"
      skip_label:
        description: PRs carrying this label are not reviewed (e.g. in-vessel-review). Empty for none.
        type: string
        default: ""
      model:
        description: Claude model for the review. Always explicit, never the action default.
        type: string
        default: claude-sonnet-5-5
      caller_workflow:
        description: Path of the calling workflow; PRs that change it need manual review.
        type: string
        default: .github/workflows/claude-code-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    # Fork PRs never receive the token; labelled PRs opt out.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (inputs.skip_label == '' || !contains(github.event.pull_request.labels.*.name, inputs.skip_label))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Crew convoys open PRs as the flotilla-crew GitHub App; the action's
          # human-actor guard would otherwise refuse to review them.
          allowed_bots: "flotilla-crew"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the issue it implements. Find that issue from the
            PR body ("Closes #N", "Part of #N", or an issue number in the title) and read it with
            `gh issue view`. Its body is the contract: what to build, what is out of scope, and the
            acceptance tests. If the PR names no issue, say so and review against the PR body.

            Use ${{ inputs.guidance }} for the repository's conventions. The owner's standing
            rules for every flotilla-org repository:
            - One implementation per job. A change extends the existing code in place; it does
              not build a second pipeline, reader, cache or store beside it.
            - A change that replaces code deletes the code it replaces.
            - No timers, polling loops, sleeps or retries as fixes. The writer of an event
              records it; readers react to it.
            - Write only what something reads: no stored fields, indexes, options, messages or
              parameters without a reader.
            - No defensive crouch: no speculative hardening, leniency (accepting several shapes
              of one input) or limits that the contract does not ask for.

            Report only these two kinds of finding:
            1. **Bug**: a concrete failure inside the contract's use. Give the input or sequence,
               what goes wrong, and file:line. No "consider", "might want to" or "it would be
               worth" items.
            2. **Waste**: code the change could do without. Code beyond the contract; code that
               duplicates existing code (name the existing code with file:line); code nothing
               calls; a timer, poll or retry; a new field, option or message without a reader;
               a test that cannot fail. Say what to delete.

            Do not suggest new features, options, limits, timeouts, validation or hardening
            unless it fixes a Bug as defined above. A smaller diff that meets the contract is
            better than a larger one. Number each finding so it can be answered on its own, and
            mark it **blocking** or **non-blocking**.

            Review the diff and relevant source directly in this session. Do not invoke
            /code-review or another review skill. Complete the review and post its
            comment before returning your final response; a promise to finish later
            does not complete this CI job.

            Review source only. Dedicated CI jobs run builds, tests, and linters;
            do not run those commands as part of this review.

            AFTER reviewing,
              * CHECK your findings against the existing comments and replies on the PR. Drop
                findings that are already addressed, or that the implementer declined with a
                reason you accept. Repeat a finding only when it still applies, with the reason,
                and say plainly which earlier findings are resolved. Do not raise new
                non-blocking findings on code an earlier round already reviewed.
              * ALWAYS use `gh pr comment` with your Bash tool to leave your review as a SINGLE
                comment on the PR, formatted as markdown, even if just to say that you found no
                issues. Open it with the lines the PR adds and removes and the number of
                blocking findings.
              * Include this marker in that comment: <!-- flotilla-review:${{ github.event.pull_request.head.sha }} -->
              * End the comment with this line, and nothing after it:
                <!-- review-findings: N -->
                where N is the number of findings in this comment the implementer still has to
                act on (0 when there are none).
              * Use `gh pr comment` with a quoted heredoc on stdin (`--body-file -`); do not create a temporary file or wrap the command in another shell.
          claude_args: >-
            --model ${{ inputs.model }}
            --disallowed-tools Skill
            --allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"

      - name: Summarize review permission denials
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const messages = JSON.parse(fs.readFileSync(process.env.REVIEW_EXECUTION_FILE, 'utf8'));
            // Log fixed categories only, never tool arguments, results, or model prose.
            const toolNames = new Set(['Read', 'Glob', 'Grep', 'Write', 'Edit', 'Skill', 'Agent', 'Task', 'WebFetch', 'WebSearch']);
            const prefixes = ['gh pr comment', 'gh pr diff', 'gh pr view', 'gh api', 'git diff', 'git show', 'git log', 'cat', 'sed', 'rg', 'grep', 'python3', 'python', 'node', 'ls'];
            const counts = {};
            let total = 0;
            for (const message of messages) {
              if (message.type !== 'result') continue;
              for (const denial of message.permission_denials ?? []) {
                let category = toolNames.has(denial.tool_name) ? denial.tool_name : 'other tool';
                if (denial.tool_name === 'Bash') {
                  const command = (denial.tool_input?.command ?? '').trimStart();
                  const prefix = prefixes.find(value => command === value || command.startsWith(value + ' '));
                  category = prefix ? `Bash: ${prefix}` : 'Bash: other command';
                }
                counts[category] = (counts[category] ?? 0) + 1;
                total++;
              }
            }
            core.info(JSON.stringify({permission_denials: total, categories: counts}, null, 2));

      - name: Require a posted review for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
        with:
          script: |
            // The review service deliberately skips changes to its own workflow.
            // Those PRs need manual review before this configuration can run on main.
            if (!process.env.REVIEW_EXECUTION_FILE) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              if (files.some(file => file.filename === process.env.CALLER_WORKFLOW)) {
                core.notice("Automated review skipped for a workflow change; manual review is required.");
                return;
              }
            }
            const marker = `<!-- flotilla-review:${context.payload.pull_request.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (!comments.some(comment => comment.user?.type === "Bot" && comment.body?.includes(marker))) {
              core.setFailed("The review action finished without posting a review for this commit. Check its tool-permission denials and output.");
            }
